services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pojun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pojun}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pojun} -d ${POSTGRES_DB:-pojun}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  pojun:
    # 镜像在 GHCR 与 Docker Hub 双源发布；默认走 GHCR（发布工作流必然推送），
    # 需要换源时用 POJUN_IMAGE 覆盖。
    image: ${POJUN_IMAGE:-ghcr.io/chu0119/pojun}:${POJUN_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POJUN_PG_DSN: postgres://${POSTGRES_USER:-pojun}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pojun}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      POJUN_LLM_PROVIDER: ${POJUN_LLM_PROVIDER:-}
      POJUN_LLM_MODEL: ${POJUN_LLM_MODEL:-}
      POJUN_LLM_BASE_URL: ${POJUN_LLM_BASE_URL:-}
      POJUN_LLM_PROXY: ${POJUN_LLM_PROXY:-}
    ports:
      # 宿主端口可通过 .env 覆盖。注意：Windows 上 8787 常被 WSL 的 wslrelay.exe
      # 绑定到 127.0.0.1（它比 0.0.0.0 更具体），会把 localhost 流量绕进 WSL 虚拟机，
      # 虚拟机休眠时表现为「localhost 间歇打不开」。故本机默认改用 8887。
      - "${POJUN_UI_PORT:-8787}:8787"
      - "127.0.0.1:${POJUN_PROXY_PORT:-8788}:8788"
      # 回连端口映射(按需放开):容器内 MSF/listener 监听的端口要映射到宿主,
      # agent 才能收到 reverse shell。示例(解除注释并按需改):
      # - "4444-4450:4444-4450"
    volumes:
      # 把数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
