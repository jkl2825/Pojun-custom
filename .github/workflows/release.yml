name: release
on:
  workflow_dispatch:
  push:
    tags: ["custom/v*"]

permissions:
  contents: write # 创建 Release 需要
  packages: write # 推送镜像到 GHCR 需要

jobs:
  # ① 前端静态导出（一次），产物给交叉编译各平台复用
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # ② Linux 交叉编译（amd64/arm64，内嵌前端）+ 打 zip。
  #    暂不适配 Windows/macOS：产品定位是 Linux 服务器常驻部署。
  binaries:
    needs: frontend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          POJUN_TARGET_OS: ${{ matrix.goos }}
          POJUN_TARGET_ARCH: ${{ matrix.goarch }}
          POJUN_BUILD_VERSION: ${{ startsWith(github.ref, 'refs/tags/custom/') && github.ref_name || format('0.4.54-custom-{0}', github.run_number) }}
          POJUN_LOCAL_PATCH: downstream-custom
          POJUN_SOURCE_REVISION: ${{ github.sha }}
          POJUN_UPSTREAM_REVISION: 234dd89a52eebc0dc84fce121e5456f2748fcaa3
          POJUN_SKIP_FRONTEND: "1"
          POJUN_SKIP_NPM_CI: "1"
          # UPX 自解压 ELF 在部分 Linux 内核、虚拟化和安全策略下会崩溃。
          # Release 使用 Go linker 裁剪和 zip 压缩，优先保证可移植性。
          POJUN_COMPRESS: "0"
          POJUN_PACKAGE: "1"
          POJUN_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${POJUN_TARGET_OS}/${POJUN_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/pojun-linux-amd64/pojun -h
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
      # Linux 生二进制单独上传，供 docker job 复用（免在镜像里重编前端+Go）
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/pojun-linux-${{ matrix.goarch }}/pojun

  # ③ 汇总所有 zip → 创建 GitHub Release
  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      # 这个 job 只拿到 dist/ 产物，没有工作区；install.sh 要从仓库取，所以必须 checkout。
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS
      # install.sh 也作为 Release 资产发布：README 推荐的
      # `curl -fsSL .../releases/latest/download/install.sh | sudo bash` 就取这里。
      - name: Stage install.sh
        run: cp install.sh dist/install.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
            dist/install.sh
          generate_release_notes: true

  # ④ 多架构镜像（复用 binaries 编好的 Linux 二进制，镜像里只装工具 + 放二进制；
  #    arm64 仅需模拟 apt 层，构建快很多）。
  #    始终发布到 GHCR（ghcr.io/chu0119/pojun）——用 Actions 内置 GITHUB_TOKEN，
  #    无需配置任何 secrets；若另外配置了 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
  #    secrets，则同时推送到 <DockerHub用户名>/pojun，方便习惯 Docker Hub 的用户。
  docker-cred-check:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets，跳过 Docker Hub 镜像发布（GHCR 发布不受影响）"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  docker:
    needs: [binaries, docker-cred-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # 取 Dockerfile 与 skills/
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # GHCR 登录：公开仓库内置 GITHUB_TOKEN 即可，无需任何配置
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hub 登录：仅在配置了 secrets 时执行
      - uses: docker/login-action@v3
        if: needs.docker-cred-check.outputs.ok == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: 组装镜像名列表
        id: images
        env:
          DOCKERHUB_OK: ${{ needs.docker-cred-check.outputs.ok }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          imgs="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          if [ "$DOCKERHUB_OK" = "true" ] && [ -n "$DOCKERHUB_USERNAME" ]; then
            imgs="$imgs,${DOCKERHUB_USERNAME}/pojun"
          fi
          echo "images=$imgs" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.images.outputs.images }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
